name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Hostinger Horizons serves the Git document root (index.html + /assets).
    # Skipping CI on the sync commit prevents a deploy loop.
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write production env file (avoid shell/$ truncation of JWT secrets)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ADMIN_ID: ${{ secrets.VITE_ADMIN_ID }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          required = ["VITE_SUPABASE_URL", "VITE_SUPABASE_ANON_KEY"]
          missing = [k for k in required if not (os.environ.get(k) or "").strip()]
          if missing:
              raise SystemExit(f"Missing required secrets: {', '.join(missing)}")
          anon = os.environ["VITE_SUPABASE_ANON_KEY"].strip()
          if len(anon) < 100 or anon.count(".") != 2:
              raise SystemExit(
                  f"VITE_SUPABASE_ANON_KEY looks invalid (len={len(anon)}). "
                  "Re-paste the full anon JWT in GitHub Actions secrets."
              )
          keys = [
              "VITE_SUPABASE_URL",
              "VITE_SUPABASE_ANON_KEY",
              "VITE_API_URL",
              "VITE_ADMIN_ID",
              "VITE_ADMIN_EMAILS",
          ]
          lines = []
          for key in keys:
              val = (os.environ.get(key) or "").strip()
              if not val:
                  continue
              # Quote so dotenv never expands $ inside JWTs / secrets.
              safe = val.replace("\\", "\\\\").replace('"', '\\"')
              lines.append(f'{key}="{safe}"')
          Path(".env.production.local").write_text("\n".join(lines) + "\n")
          print("Wrote .env.production.local")
          print("VITE_SUPABASE_URL set:", bool(os.environ.get("VITE_SUPABASE_URL")))
          print("VITE_SUPABASE_ANON_KEY length:", len(anon))
          print("VITE_API_URL set:", bool(os.environ.get("VITE_API_URL")))
          PY

      - name: Build production site for Hostinger root
        run: npm run build:hostinger

      - name: Verify baked Supabase anon key in bundle
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("assets").glob("index-*.js"))
          if not files:
              raise SystemExit("No assets/index-*.js after build")
          text = files[-1].read_text(errors="ignore")
          if "placeholder.supabase.co" in text and "zrvdtpxfmuijhionbaxr.supabase.co" not in text:
              raise SystemExit("Bundle still points at placeholder Supabase URL")
          matches = re.findall(r'"(eyJhbGciOiJIUzI1NiIs[^"]+)"', text)
          if not matches:
              raise SystemExit("No JWT anon key found in bundle")
          key = max(matches, key=len)
          if len(key) < 100 or key.count(".") != 2:
              raise SystemExit(f"Baked anon key is truncated/invalid (len={len(key)})")
          print("Bundle anon key OK, length", len(key), "file", files[-1].name)
          PY

      - name: Commit Hostinger root artifacts for Git sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Hostinger Horizons serves repo root — never git-add ignored dist/
          git add index.html .htaccess
          git add -A assets
          if git diff --cached --quiet; then
            echo "No Hostinger root artifact changes to commit."
          else
            git commit -m "chore: sync Hostinger production build [skip ci]"
            git push origin HEAD:main
            echo "Committed and pushed Hostinger root build for Horizons Git sync."
          fi

      # FTP remains a secondary publish path (some Hostinger setups also read FTP root).
      - name: Deploy dist/ to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store
            **/.git*
            **/Dashboard _ Hostinger.html
            **/Dashboard _ Hostinger_files/**
