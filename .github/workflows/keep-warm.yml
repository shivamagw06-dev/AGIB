name: Keep AGIB services warm

# Pings both Render services on a schedule so neither one idles into a cold
# start. Primary fix is the Render plan (see render.yaml — must be Starter+,
# not Free); this workflow is a second layer of defense plus an early
# warning if a service is actually down (job fails -> visible in Actions).

on:
  schedule:
    # Every 10 minutes, day and night.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Node API health
        run: |
          code=$(curl -sS -o /tmp/api.json -w '%{http_code}' --max-time 30 \
            https://finance-news-backend-19i5.onrender.com/api/health || echo 000)
          echo "agib-api /api/health -> $code"
          cat /tmp/api.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::warning::agib-api health check returned $code"
          fi

      - name: Ping Intelligence Engine health
        run: |
          code=$(curl -sS -o /tmp/engine.json -w '%{http_code}' --max-time 30 \
            https://agib-intelligence-engine.onrender.com/v1/health || echo 000)
          echo "agib-intelligence-engine /v1/health -> $code"
          cat /tmp/engine.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::warning::agib-intelligence-engine health check returned $code"
          fi

      - name: Warm lightweight public briefing only
        run: |
          # Health probes above keep Render awake. Do not make full-universe
          # terminal/dashboard calls here: they compete directly with users.
          code=$(curl -sS -o /tmp/warm.json -w '%{http_code}' --max-time 8 \
            "https://finance-news-backend-19i5.onrender.com/api/market/briefing" || echo 000)
          echo "briefing -> $code"
