services:
  # Existing AGIB Node API gateway (finance-news-backend)
  - type: web
    name: agib-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTELLIGENCE_ENGINE_URL
        fromService:
          name: agib-intelligence-engine
          type: web
          property: host
      - key: INTELLIGENCE_ENGINE_TOKEN
        generateValue: true
      - key: CIO_MORNING_SCHEDULER
        value: "true"

  # Python multi-agent Intelligence Engine
  - type: web
    name: agib-intelligence-engine
    runtime: python
    rootDir: intelligence-engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: INTELLIGENCE_ENGINE_TOKEN
        fromService:
          name: agib-api
          type: web
          envVarKey: INTELLIGENCE_ENGINE_TOKEN
      - key: AGIB_API_BASE_URL
        fromService:
          name: agib-api
          type: web
          property: host
      # FAA live public acquisition (set TAVILY_API_KEY in Render dashboard)
      - key: FAA
        value: "true"
      - key: FAA_LIVE_FETCH
        value: "true"
      - key: FAA_MAX_WORKERS
        value: "6"
      - key: FAA_SEARCH_API
        value: "true"
      - key: TAVILY_API_KEY
        sync: false
      # AGIB Intelligence Layer V2
      - key: AIL
        value: "true"
      - key: AIL_ASK_AGI
        value: "true"
      - key: FRE
        value: "true"
      - key: FRE_ASK_AGI
        value: "true"
